<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS</title>
<style>
  :root { --bg:#0a0e14; --panel:#0f1623; --border:#1c2738; --text:#c5d0e0; --dim:#5a6a85; --accent:#4cc9f0; --green:#4ade80; --yellow:#facc15; --red:#f87171; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font:14px/1.5 'Segoe UI',system-ui,sans-serif; min-height:100vh; }
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:16px 28px; border-bottom:1px solid var(--border); background:var(--panel); position:sticky; top:0; z-index:10; }
  .topbar h1 { font-size:20px; letter-spacing:4px; }
  .topbar h1 span { color:var(--accent); }
  .repo-bar { display:flex; align-items:center; gap:14px; font-size:13px; }
  .repo-bar .commit { font-family:monospace; background:var(--bg); padding:4px 8px; border-radius:4px; border:1px solid var(--border); }
  .repo-bar .update { color:var(--green); animation:pulse 1.5s infinite; }
  .repo-bar button { background:var(--accent); color:var(--bg); border:none; padding:8px 16px; border-radius:6px; font-weight:600; cursor:pointer; font-size:13px; }
  .repo-bar button:hover { opacity:0.85; }
  @keyframes pulse { 50% { opacity:0.5; } }
  .layout { display:grid; grid-template-columns:1fr 340px; gap:20px; padding:20px 28px; }
  @media (max-width:900px) { .layout { grid-template-columns:1fr; } }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:18px; transition:border-color .2s; }
  .card.online { border-left:3px solid var(--green); }
  .card.offline { opacity:0.5; border-left:3px solid var(--dim); }
  .card h3 { font-size:15px; margin-bottom:4px; }
  .card .sub { color:var(--dim); font-size:12px; margin-bottom:14px; }
  .bars { display:flex; flex-direction:column; gap:10px; }
  .bar { display:flex; align-items:center; gap:8px; font-size:12px; }
  .bar .label { width:34px; color:var(--dim); }
  .bar .track { flex:1; height:7px; background:var(--bg); border-radius:4px; overflow:hidden; }
  .bar .fill { height:100%; border-radius:4px; transition:width .5s; background:var(--accent); }
  .bar .val { width:38px; text-align:right; font-family:monospace; }
  .card .uptime { margin-top:12px; font-size:11px; color:var(--dim); }
  .side { display:flex; flex-direction:column; gap:16px; }
  .log { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; }
  .log h3 { font-size:13px; letter-spacing:1px; color:var(--dim); margin-bottom:10px; }
  .log-body { font-family:monospace; font-size:12px; max-height:420px; overflow-y:auto; display:flex; flex-direction:column-reverse; gap:3px; }
  .log-body .entry { color:var(--dim); word-break:break-word; }
  .log-body .entry .from { color:var(--accent); }
  .log-body .entry.error { color:var(--red); }
  .empty { color:var(--dim); text-align:center; padding:60px 20px; grid-column:1/-1; font-size:13px; }
</style>
</head>
<body>
<div class="topbar">
  <h1>N E X <span>U S</span></h1>
  <div class="repo-bar" id="repoBar">
    <span class="commit" id="commitText">—</span>
    <span id="updateBadge" style="display:none" class="update">● güncelleme var</span>
  </div>
</div>

<div class="layout">
  <div class="grid" id="agentGrid">
    <div class="empty">Cihaz bekleniyor...</div>
  </div>
  <div class="side">
    <div class="log">
      <h3>GÜNLÜK</h3>
      <div class="log-body" id="logBody"></div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io({ query: { type: 'browser' } });
const grid = document.getElementById('agentGrid');
const logBody = document.getElementById('logBody');
const commitText = document.getElementById('commitText');
const updateBadge = document.getElementById('updateBadge');

function uptimeFmt(s) {
  const d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60);
  return (d?d+'g ':'')+(h?h+'s ':'')+m+'dk';
}
function fillColor(v, y, r) {
  return v >= (r||90) ? 'var(--red)' : v >= (y||75) ? 'var(--yellow)' : 'var(--accent)';
}
function renderAgents(list) {
  if (!list || !list.length) { grid.innerHTML = '<div class="empty">Cihaz bekleniyor...</div>'; return; }
  grid.innerHTML = list.map(a => {
    const s = a.stats || {};
    return `<div class="card ${a.status}">
      <h3>${a.hostname}</h3>
      <div class="sub">${a.platform} · ${a.ip || '?'}</div>
      <div class="bars">
        ${['cpu','ram','disk'].map(k => {
          const v = Math.round(s[k]||0);
          return `<div class="bar"><span class="label">${k.toUpperCase()}</span><span class="track"><span class="fill" style="width:${v}%;background:${fillColor(v,75,90)}"></span></span><span class="val">${v}%</span></div>`;
        }).join('')}
      </div>
      <div class="uptime">açık: ${s.uptime?uptimeFmt(s.uptime):'—'}</div>
    </div>`;
  }).join('');
}
function logEntry(from, msg, isErr) {
  const div = document.createElement('div');
  div.className = 'entry' + (isErr ? ' error' : '');
  const time = new Date().toLocaleTimeString('tr');
  div.innerHTML = `<span class="from">[${time}] ${from}</span> ${msg}`;
  logBody.prepend(div);
  while (logBody.children.length > 60) logBody.removeChild(logBody.lastChild);
}

socket.on('agent-list', renderAgents);
socket.on('stats-update', ({id, stats}) => {
  const card = grid.querySelector(`.card`); // simple: full re-render is cheap enough
  socket.emit('noop'); // keepalive not needed; list refresh below
});
// Re-request list periodically for live stats
setInterval(() => fetch('/api/agents').then(r=>r.json()).then(renderAgents).catch(()=>{}), 3000);

socket.on('repo-info', (i) => {
  commitText.textContent = i.commit ? `${i.branch||''}@${i.commit}` : 'git yok';
  updateBadge.style.display = i.update ? '' : 'none';
});
socket.on('update-status', ({from, stage, msg}) => {
  logEntry(from, `${stage}: ${msg}`, stage === 'error');
});
</script>
</body>
</html>
