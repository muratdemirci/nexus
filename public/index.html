<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0e14">
<title>NEXUS</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/xterm/css/xterm.css">
<style>
  :root { --bg:#0a0e14; --panel:#0f1623; --border:#1c2738; --text:#c5d0e0; --dim:#5a6a85; --accent:#4cc9f0; --green:#4ade80; --yellow:#facc15; --red:#f87171; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font:14px/1.5 'Segoe UI',system-ui,sans-serif; min-height:100vh; }
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:12px 28px; border-bottom:1px solid var(--border); background:var(--panel); position:sticky; top:0; z-index:10; gap:12px; flex-wrap:wrap; }
  .topbar h1 { font-size:20px; letter-spacing:4px; }
  .topbar h1 span { color:var(--accent); }
  .repo-bar { display:flex; align-items:center; gap:14px; font-size:13px; }
  .repo-bar .commit { font-family:monospace; background:var(--bg); padding:4px 8px; border-radius:4px; border:1px solid var(--border); }
  .repo-bar .update { color:var(--green); animation:pulse 1.5s infinite; }
  @keyframes pulse { 50% { opacity:0.5; } }
  .topbar-actions { display:flex; gap:8px; }
  .tbtn { background:var(--panel); color:var(--text); border:1px solid var(--border); padding:5px 12px; border-radius:6px; cursor:pointer; font-size:12px; font-weight:600; }
  .tbtn:hover { border-color:var(--accent); color:var(--accent); }
  .layout { display:grid; grid-template-columns:1fr 340px; gap:20px; padding:20px 28px; }
  @media (max-width:900px) { .layout { grid-template-columns:1fr; } }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:16px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px 16px; border-left:3px solid var(--green); position:relative; }
  .card.warn { border-left-color:var(--yellow); }
  .card.crit { border-left-color:var(--red); }
  .card .net-badge { position:absolute; top:12px; right:14px; font-size:11px; padding:2px 8px; border-radius:10px; font-weight:600; }
  .card .net-online { background:rgba(74,222,128,.15); color:var(--green); }
  .card .net-offline { background:rgba(248,113,113,.15); color:var(--red); }
  .card h3 { font-size:15px; margin-bottom:2px; padding-right:80px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .sub { color:var(--dim); font-size:12px; margin-bottom:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .sysinfo { font-size:11px; color:var(--dim); margin-bottom:10px; line-height:1.5; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; }
  .card .sysinfo span { color:var(--text); }
  .bars { display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
  .bar { display:flex; align-items:center; gap:8px; font-size:12px; }
  .bar .label { width:34px; color:var(--dim); }
  .bar .track { flex:1; height:6px; background:var(--bg); border-radius:4px; overflow:hidden; }
  .bar .fill { display:block; height:100%; border-radius:4px; transition:width .35s ease, background .35s ease; background:var(--accent); }
  .bar .val { width:72px; text-align:right; font-family:monospace; color:var(--dim); }
  .card .footer { display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--dim); margin-bottom:8px; }
  .card-actions { display:flex; gap:4px; flex-wrap:nowrap; }
  .term-btn { background:var(--accent); color:var(--bg); border:none; padding:4px 8px; border-radius:5px; font-weight:600; cursor:pointer; font-size:10px; flex:1; white-space:nowrap; }
  .term-btn:hover { opacity:.85; }
  .term-btn.ghost { background:var(--panel); color:var(--text); border:1px solid var(--border); }
  .term-btn.ghost:hover { border-color:var(--accent); }
  .term-btn.danger { background:rgba(248,113,113,.15); color:var(--red); border:1px solid var(--red); }
  .term-btn.danger:hover { background:var(--red); color:var(--bg); }
  .side { display:flex; flex-direction:column; gap:16px; }
  .net, .log, .history { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; }
  .net h3, .log h3, .history h3 { font-size:13px; letter-spacing:1px; color:var(--dim); margin-bottom:10px; }
  .net-item { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 8px; border-radius:6px; font-size:12px; }
  .net-item:nth-child(odd) { background:rgba(255,255,255,.02); }
  .net-item .tag { font-size:10px; padding:1px 7px; border-radius:8px; text-transform:uppercase; letter-spacing:.5px; font-weight:600; }
  .net-item .tag.hub { background:rgba(76,201,240,.15); color:var(--accent); }
  .net-item .tag.agent { background:rgba(74,222,128,.15); color:var(--green); }
  .net-item .who { flex:1; min-width:0; }
  .net-item .who b { color:var(--text); }
  .net-item .who .ip { color:var(--dim); font-family:monospace; font-size:11px; }
  .net-empty { color:var(--dim); font-size:12px; padding:6px 8px; }
  .log-body { font-family:monospace; font-size:12px; height:340px; overflow-y:auto; display:flex; flex-direction:column-reverse; gap:3px; }
  .log-body .entry { color:var(--dim); word-break:break-word; }
  .log-body .entry .from { color:var(--accent); }
  .log-body .entry.error { color:var(--red); }
  .log-body .entry.warn { color:var(--yellow); }
  .empty { color:var(--dim); text-align:center; padding:60px 20px; grid-column:1/-1; }
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:100; justify-content:center; align-items:center; }
  .modal-overlay.active { display:flex; }
  .modal { background:var(--panel); border:1px solid var(--border); border-radius:10px; width:92vw; max-width:920px; max-height:90vh; display:flex; flex-direction:column; }
  .modal.wide { max-width:1100px; }
  .modal-head { display:flex; justify-content:space-between; align-items:center; padding:12px 18px; border-bottom:1px solid var(--border); }
  .modal-head h3 { font-size:14px; }
  .modal-head button { background:none; border:none; color:var(--dim); font-size:20px; cursor:pointer; }
  .modal-head button:hover { color:var(--red); }
  .modal-body { padding:16px 18px; overflow:auto; }
  #termContainer { padding:12px; height:500px; }
  .mform .row { display:flex; flex-direction:column; gap:4px; margin-bottom:12px; }
  .mform label { font-size:12px; color:var(--dim); }
  .mform input, .mform textarea, .mform select { background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:8px 10px; font:inherit; font-size:13px; }
  .mform textarea { font-family:monospace; resize:vertical; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:700px) { .row2 { grid-template-columns:1fr; } }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
  th { color:var(--dim); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
  td.mono { font-family:monospace; }
  .btn { background:var(--accent); color:var(--bg); border:none; padding:6px 14px; border-radius:6px; font-weight:600; cursor:pointer; font-size:12px; }
  .btn.ghost { background:var(--panel); color:var(--text); border:1px solid var(--border); }
  .btn.danger { background:rgba(248,113,113,.15); color:var(--red); border:1px solid var(--red); }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
  .chip { display:flex; align-items:center; gap:6px; background:var(--bg); border:1px solid var(--border); padding:4px 10px; border-radius:14px; font-size:12px; cursor:pointer; }
  .chip.checked { border-color:var(--accent); color:var(--accent); }
  .result-block { background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:10px 12px; margin-bottom:8px; font-family:monospace; font-size:12px; white-space:pre-wrap; max-height:180px; overflow:auto; }
  .result-block .head { color:var(--accent); margin-bottom:4px; }
  .result-block.code-0 .head { color:var(--green); }
  .result-block.code-0 { border-left-color:var(--green); border-left:3px solid; }
  .result-block.err .head { color:var(--red); background:rgba(248,113,113,.08); }
  .fs-row { display:flex; align-items:center; gap:10px; padding:6px 8px; border-radius:6px; font-size:13px; cursor:pointer; }
  .fs-row:hover { background:rgba(255,255,255,.04); }
  .fs-row .ic { width:22px; text-align:center; color:var(--dim); }
  .fs-row.dir .ic { color:var(--yellow); }
  .fs-row .meta { margin-left:auto; color:var(--dim); font-size:11px; font-family:monospace; white-space:nowrap; }
  .fs-path { font-family:monospace; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:8px 10px; font-size:12px; margin-bottom:10px; word-break:break-all; }
  .progress { width:100%; }
  .qr-img { width:260px; height:260px; image-rendering:pixelated; background:#fff; border-radius:10px; }
  .qr-box { display:flex; align-items:center; gap:24px; flex-wrap:wrap; }
  .qr-url { font-family:monospace; color:var(--accent); font-size:14px; margin-bottom:4px; }
  .hlist { list-style:none; }
  .hlist li { display:flex; justify-content:space-between; gap:10px; padding:8px 10px; border-radius:6px; font-size:12px; }
  .hlist li:nth-child(odd) { background:rgba(255,255,255,.02); }
  .hlist .cmd { font-family:monospace; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hlist .time { color:var(--dim); }
  .biglog { font-family:monospace; font-size:12px; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:12px; white-space:pre-wrap; word-break:break-all; max-height:60vh; overflow:auto; }
  .legend { font-size:11px; color:var(--dim); margin-top:10px; }
  .legend b { color:var(--text); }
</style>
</head>
<body>
<div class="topbar">
  <h1>N E X <span>U S</span></h1>
  <div class="repo-bar">
    <span class="commit" id="commitText">—</span>
    <span id="updateBadge" style="display:none" class="update">● update available</span>
  </div>
  <div class="topbar-actions">
    <button class="tbtn" onclick="openQr()">◈ Mobil</button>
    <button class="tbtn" onclick="openBatch()">» Command</button>
    <button class="tbtn" onclick="openHistory()">⇄ Logs</button>
    <button class="tbtn" onclick="openSettings()">⚙ Settings</button>
  </div>
</div>

<div class="layout">
  <div class="grid" id="agentGrid">
    <div class="empty">Waiting for devices...</div>
  </div>
  <div class="side">
    <div class="net">
      <h3>DEVICES ON NETWORK</h3>
      <div id="netBody"><div class="net-empty">Discovery running...</div></div>
    </div>
    <div class="log">
      <h3>LOG · ALERTS</h3>
      <div class="log-body" id="logBody"></div>
    </div>
    <div class="history">
      <h3>RECENT COMMANDS</h3>
      <div id="histBody"><div class="net-empty">No commands run yet.</div></div>
    </div>
  </div>
</div>

<!-- Terminal Modal -->
<div class="modal-overlay" id="termModal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="termTitle">Terminal</h3>
      <button id="termClose">×</button>
    </div>
    <div id="termContainer"></div>
  </div>
</div>

<!-- Generic modal -->
<div class="modal-overlay" id="modal">
  <div class="modal" id="modalShell">
    <div class="modal-head">
      <h3 id="mTitle"></h3>
      <button id="mClose">×</button>
    </div>
    <div class="modal-body" id="mBody"></div>
  </div>
</div>

<script src="/xterm/lib/xterm.js"></script>
<script src="/xterm-addon-fit/lib/addon-fit.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io({ query: { type: 'browser' } });
const grid = document.getElementById('agentGrid');
const logBody = document.getElementById('logBody');
const commitText = document.getElementById('commitText');
const updateBadge = document.getElementById('updateBadge');
const histBody = document.getElementById('histBody');
let termApp = null, termFit = null, termId = null;
let agentsCache = [];
let fsState = { agentId: null, hostname: null, path: '' };
let procTimer = null;
let procAgentId = null;

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function fmtTime(ms) { return ms ? new Date(ms).toLocaleTimeString('en') : '—'; }
function fmtSize(n) {
  if (n == null) return '';
  if (n >= 1e9) return (n/1e9).toFixed(1)+' GB';
  if (n >= 1e6) return (n/1e6).toFixed(1)+' MB';
  if (n >= 1e3) return (n/1e3).toFixed(1)+' KB';
  return n+' B';
}
function uptimeFmt(s) {
  if (!s) return '—';
  const d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60);
  return (d?d+'d ':'')+(h?h+'h ':'')+m+'m';
}
function fmtKB(kb) { return kb > 1024 ? (kb/1024).toFixed(1)+' MB/s' : kb.toFixed(1)+' KB/s'; }
function fillColor(v, y, r) { return v >= (r||90) ? 'var(--red)' : v >= (y||75) ? 'var(--yellow)' : 'var(--accent)'; }
function cardClass(s) {
  if (!s) return '';
  const h = Math.max(s.cpu||0, s.ram||0, s.disk||0);
  return h >= 90 ? 'crit' : h >= 75 ? 'warn' : '';
}

function renderAgents(list) {
  agentsCache = list || [];
  if (!list || !list.length) { grid.innerHTML = '<div class="empty">Waiting for devices...</div>'; return; }
  grid.innerHTML = list.map(a => {
    const s = a.stats || {};
    const net = s.netOnline ? `<span class="net-badge net-online">● online</span>` : `<span class="net-badge net-offline">● offline</span>`;
    const dlPct = Math.min(Math.max((s.netRx || 0) / 10, 0), 100);
    const ulPct = Math.min(Math.max((s.netTx || 0) / 10, 0), 100);
    return `<div class="card ${cardClass(s)}">
      ${net}
      <h3>${esc(a.hostname)}</h3>
      <div class="sub">${esc(a.osDistro || a.platform)} · ${esc(a.ip)}</div>
      <div class="sysinfo">
        ${a.cpuModel ? `CPU: <span>${esc(a.cpuModel)}</span> (${a.cpuCores} cores)<br>` : ''}
        ${a.ramTotal ? `RAM: <span>${a.ramTotal} GB</span> · ` : ''}${a.manufacturer ? `Hardware: <span>${esc(a.manufacturer)}</span>` : ''}
      </div>
      <div class="bars">
        <div class="bar"><span class="label">CPU</span><span class="track"><span class="fill" style="width:${s.cpu||0}%;background:${fillColor(s.cpu||0,75,90)}"></span></span><span class="val">${s.cpu||0}%</span></div>
        <div class="bar"><span class="label">RAM</span><span class="track"><span class="fill" style="width:${s.ram||0}%;background:${fillColor(s.ram||0,75,90)}"></span></span><span class="val">${s.ram||0}%${s.ramUsed?' ('+s.ramUsed+' GB)':''}</span></div>
        <div class="bar"><span class="label">DISK</span><span class="track"><span class="fill" style="width:${s.disk||0}%;background:${fillColor(s.disk||0,75,90)}"></span></span><span class="val">${s.disk||0}%${s.diskUsed?' ('+s.diskUsed+' GB)':''}</span></div>
        <div class="bar"><span class="label">DL</span><span class="track"><span class="fill" style="width:${dlPct}%;background:var(--green)"></span></span><span class="val">${fmtKB(s.netRx||0)}</span></div>
        <div class="bar"><span class="label">UL</span><span class="track"><span class="fill" style="width:${ulPct}%;background:var(--yellow)"></span></span><span class="val">${fmtKB(s.netTx||0)}</span></div>
      </div>
      <div class="footer"><span>up: ${uptimeFmt(s.uptime)}</span><span id="online-${esc(a.hostname)}"></span></div>
      <div class="card-actions">
        <button class="term-btn" onclick="openTerm('${a.id}','${esc(a.hostname)}')">Terminal</button>
        <button class="term-btn ghost" onclick="openProcesses('${a.id}','${esc(a.hostname)}')">Processes</button>
        <button class="term-btn ghost" onclick="openFiles('${a.id}','${esc(a.hostname)}')">Files</button>
        <button class="term-btn danger" onclick="restartAgent('${a.id}','${esc(a.hostname)}')">Restart</button>
      </div>
    </div>`;
  }).join('');
}

function updateAgentStats({ id, stats }) {
  if (!id || !stats || !agentsCache.length) return;
  const idx = agentsCache.findIndex(a => a.id === id);
  if (idx === -1) return;
  agentsCache[idx].stats = { ...agentsCache[idx].stats, ...stats };
  renderAgents(agentsCache);
}

function logEntry(from, msg, kind) {
  const div = document.createElement('div');
  div.className = 'entry' + (kind ? ' ' + kind : '');
  div.innerHTML = `<span class="from">[${new Date().toLocaleTimeString('en')}] ${esc(from)}</span> ${esc(msg)}`;
  logBody.prepend(div);
  while (logBody.children.length > 100) logBody.removeChild(logBody.lastChild);
}

// ===== Generic modal =====
const modal = document.getElementById('modal');
const mBody = document.getElementById('mBody');
const mTitle = document.getElementById('mTitle');
document.getElementById('mClose').onclick = closeModal;
modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
function showModal(title, html, wide) {
  mTitle.textContent = title;
  mBody.innerHTML = html;
  document.getElementById('modalShell').classList.toggle('wide', !!wide);
  modal.classList.add('active');
}
function closeModal() {
  if (procTimer) { clearInterval(procTimer); procTimer = null; }
  modal.classList.remove('active');
}

// ===== QR / Mobile access =====
async function openQr() {
  try {
    const r = await fetch('/api/hostinfo').then(x => x.json());
    const ip = r.host;
    showModal(`Mobile Access — ${esc(r.hostname)}`, `
      <div class="qr-box">
        <div>
          <div class="qr-url" id="qrUrl">${esc(r.url)}</div>
          <div class="legend">LAN: ${r.lanIPs.map(esc).join(', ') || '—'}${r.tailscaleIP ? '<br>Tailscale: <b>' + esc(r.tailscaleIP) + '</b>' : ''}</div>
          <div class="mform" style="margin-top:14px">
            <label>Different address (e.g. tailscale: <b>${esc(r.tailscaleIP || '')}</b> or IP)</label>
            <input id="qrHostInput" value="${esc(r.host)}" placeholder="192.168.1.10">
            <button class="btn" style="margin-top:8px" onclick="qrUpdate()">Refresh QR</button>
          </div>
        </div>
        <img id="qrImg" class="qr-img" alt="QR" src="/api/qr?host=${encodeURIComponent(r.host)}">
      </div>`, true);
    window._qrHost = r.host;
    document.getElementById('qrUrl').textContent = r.url;
  } catch (e) { logEntry('QR', e.message, 'error'); }
}
function qrUpdate() {
  const host = document.getElementById('qrHostInput').value.trim() || window._qrHost;
  document.getElementById('qrImg').src = `/api/qr?host=${encodeURIComponent(host)}`;
}

// ===== Batch / single command =====
function openBatch(agentId, hostname) {
  const ids = agentId ? [agentId] : agentsCache.map(a => a.id);
  const labels = agentId ? [hostname] : agentsCache.map(a => a.hostname);
  const checks = agentsCache.map((a, i) =>
    `<label class="chip ${!agentId ? 'checked' : ''}">
      <input type="checkbox" data-id="${a.id}" ${!agentId ? 'checked' : ''} style="accent-color:var(--accent)">
      ${esc(a.hostname)}
    </label>`).join('');
  showModal(agentId ? `Command — ${esc(hostname)}` : 'Batch Command', `
    <div class="mform">
      <div class="row"><label>Devices</label><div class="chips" id="batchChips">${checks || '<div class="net-empty">No agents</div>'}</div></div>
      <div class="row"><label>Command (blocked if not whitelisted)</label>
        <textarea id="bcCmd" rows="2" placeholder="e.g. df -h"></textarea></div>
      <div class="row2">
        <div class="row"><label>Directory (optional)</label><input id="bcCwd" placeholder="${esc(navigator.userAgent.includes('Win') ? 'C:\\Users' : '~')}"></div>
        <div class="row"><label>Timeout (sec)</label><input id="bcTimeout" type="number" value="30"></div>
      </div>
      <button class="btn" id="bcRun" onclick="runBatch()">Run</button>
    </div>
    <div id="bcResults" style="margin-top:14px"></div>`, true);
}
async function runBatch() {
  const ids = [...document.querySelectorAll('#batchChips input:checked')].map(i => i.dataset.id);
  const command = document.getElementById('bcCmd').value.trim();
  const cwd = document.getElementById('bcCwd').value.trim();
  const timeout = parseInt(document.getElementById('bcTimeout').value, 10) || 30;
  const btn = document.getElementById('bcRun');
  if (!ids.length || !command) { alert('Select a command and device'); return; }
  btn.disabled = true; btn.textContent = 'Running...';
  const div = document.getElementById('bcResults');
  div.innerHTML = '<div class="result-block"><div class="head">sending...</div></div>';
  try {
    const res = await fetch('/api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ agentIds: ids, command, cwd, timeout }),
    }).then(r => r.json());
    const names = [];
    for (const a of agentsCache) names[a.id] = a.hostname;
    div.innerHTML = Object.entries(res).map(([id, r]) => {
      const name = names[id] || '?';
      if (!r.ok) return `<div class="result-block err"><div class="head">${esc(name)} — error</div>${esc(r.error || '')}</div>`;
      const out = r.data.stdout || '(no output)';
      const err = r.data.stderr ? '\n[stderr]\n' + r.data.stderr : '';
      const cls = r.data.code === 0 ? 'code-0' : 'err';
      return `<div class="result-block ${cls}">
        <div class="head">${esc(name)} · exit code ${r.data.code}</div>${esc(out)}${esc(err)}
      </div>`;
    }).join('') || '<div class="net-empty">No results</div>';
  } catch (e) {
    div.innerHTML = `<div class="result-block err"><div class="head">error</div>${esc(e.message)}</div>`;
  }
  btn.disabled = false; btn.textContent = 'Run';
}

// ===== Process manager =====
function openProcesses(agentId, hostname) {
  procAgentId = agentId;
  showModal(`Processes — ${esc(hostname)}`, `<div id="procBody"><div class="net-empty">Loading...</div></div>`, true);
  loadProcs();
  if (procTimer) clearInterval(procTimer);
  procTimer = setInterval(loadProcs, 4000);
  window.addEventListener('beforeunload', () => { if (procTimer) clearInterval(procTimer); });
}
async function loadProcs() {
  if (!procAgentId) return;
  try {
    const list = await fetch('/api/processes/' + procAgentId).then(r => r.json());
    const body = document.getElementById('procBody');
    if (!body) return;
    const sorted = list.slice().sort((a, b) => b.cpu - a.cpu);
    body.innerHTML = `<table>
      <tr><th>PID</th><th>Name</th><th>CPU</th><th>RAM MB</th><th>Command</th><th></th></tr>
      ${sorted.map(p => `<tr>
        <td class="mono">${p.pid}</td>
        <td>${esc(p.name)}</td>
        <td>${p.cpu}%</td>
        <td>${p.mem}</td>
        <td class="mono" title="${esc(p.command)}">${esc((p.command||'').slice(0,60))}</td>
        <td><button class="term-btn danger" onclick="killProc(${p.pid})">Kill</button></td>
      </tr>`).join('')}
    </table>`;
  } catch (e) {
    const body = document.getElementById('procBody');
    if (body) body.innerHTML = `<div class="result-block err">${esc(e.message)}</div>`;
  }
}
async function killProc(pid) {
  if (!pid) return;
  try {
    await fetch('/api/kill', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ agentId: procAgentId, pid }) });
    loadProcs();
  } catch (e) { alert(e.message); }
}

// ===== File explorer =====
async function openFiles(agentId, hostname) {
  fsState = { agentId, hostname, path: '' };
  showModal(`Files — ${esc(hostname)}`, `<div id="fsBody"><div class="net-empty">Loading...</div></div>`, true);
  fsLoad('/');
}
async function fsLoad(p) {
  const body = document.getElementById('fsBody');
  if (!body) return;
  fsState.path = p || '';
  body.innerHTML = '<div class="net-empty">Loading...</div>';
  try {
    const d = await fetch(`/api/fs?agent=${encodeURIComponent(fsState.agentId)}&path=${encodeURIComponent(p || '')}`).then(r => r.json());
    if (d.error) throw new Error(d.error);
    const rows = d.items.map(i => {
      const newPath = fsState.path + (fsState.path && !/[/\\]$/.test(fsState.path) ? (fsState.path.includes('\\') ? '\\' : '/') : '') + i.name;
      if (i.type === 'dir') {
        return `<div class="fs-row dir" onclick="fsLoad(&quot;${esc(newPath)}&quot;)">
          <span class="ic">▸</span><span>${esc(i.name)}</span>
          <span class="meta"></span>
        </div>`;
      }
      return `<div class="fs-row" onclick="fsDownload(&quot;${esc(newPath)}&quot;)">
        <span class="ic">✛</span><span>${esc(i.name)}</span>
        <span class="meta">${fmtSize(i.size)} · ${fmtTime(i.mtime)}</span>
      </div>`;
    }).join('');
    body.innerHTML = `
      <div class="fs-path" id="fsPath">${esc(fsState.path || '/')}</div>
      <div class="card-actions" style="margin-bottom:10px">
        ${fsState.path ? `<button class="term-btn ghost" onclick="fsParent()">↑ Parent</button>` : ''}
        <label class="term-btn ghost" style="display:inline-block;cursor:pointer">⬆ Upload
          <input type="file" id="fsFile" style="display:none" onchange="fsUpload()">
        </label>
        <button class="term-btn" onclick="fsRefresh()">↻ Refresh</button>
      </div>
      ${rows || '<div class="net-empty">Empty directory</div>'}`;
  } catch (e) {
    body.innerHTML = `<div class="result-block err">${esc(e.message)}</div>`;
  }
}
function fsParent() {
  const pp = fsState.path.replace(/[\\/]+$/, '');
  if (!pp) return;
  const idx = Math.max(pp.lastIndexOf('/'), pp.lastIndexOf('\\'));
  fsLoad(idx <= 0 ? '' : pp.slice(0, idx));
}
function fsRefresh() { fsLoad(fsState.path); }
function fsDownload(path) {
  window.open(`/api/download?agent=${encodeURIComponent(fsState.agentId)}&path=${encodeURIComponent(path)}`, '_blank');
}
async function fsUpload() {
  const input = document.getElementById('fsFile');
  if (!input || !input.files || !input.files[0]) return;
  const file = input.files[0];
  const dest = fsState.path + (fsState.path && !fsState.path.endsWith('/') && !fsState.path.endsWith('\\') ? '/' : '') + file.name;
  try {
    await fetch(`/api/upload?agent=${encodeURIComponent(fsState.agentId)}&path=${encodeURIComponent(dest)}`, { method: 'POST', body: file });
    logEntry('File', `${file.name} → ${fsState.hostname}:${dest}`, '');
    fsRefresh();
  } catch (e) { alert(e.message); }
}

// ===== Restart agent =====
async function restartAgent(agentId, hostname) {
  if (!confirm(`Restart ${hostname}?`)) return;
  try {
    await fetch('/api/restart/' + agentId, { method: 'POST' });
    logEntry('Restart', `${hostname} starting...`, 'warn');
  } catch (e) { alert(e.message); }
}

// ===== History: commands + terminal logs =====
async function openHistory() {
  showModal('Logs — Command History & Terminal Sessions', '<div class="net-empty">Loading...</div>', true);
  const names = {};
  for (const a of agentsCache) names[a.id] = a.hostname;
  try {
    const [hist, logs] = await Promise.all([
      fetch('/api/history').then(r => r.json()),
      fetch('/api/logs').then(r => r.json()),
    ]);
    const histRows = hist.map(h => h.list.map((c, i) => `
      <li>
        <span class="cmd">${esc(c.command)}</span>
        <span class="time">${names[h.id] || h.id.slice(0,8)} · ${new Date(c.ts).toLocaleTimeString('en')} · code ${c.code}</span>
      </li>`).join('')).join('');
    const logRows = logs.map(l => `
      <li>
        <span class="cmd">${esc(l.hostname)} · ${l.start ? new Date(l.start).toLocaleString('en') : '—'} · ${fmtSize(l.chars)}</span>
        <button class="term-btn ghost" onclick="viewLog('${l.termId}')">View</button>
      </li>`).join('');
    const body = document.getElementById('mBody');
    body.innerHTML = `
      <h3 style="font-size:13px;color:var(--dim);margin:6px 0 8px">COMMAND HISTORY</h3>
      <ul class="hlist">${histRows || '<li><span class="cmd">—</span></li>'}</ul>
      <h3 style="font-size:13px;color:var(--dim);margin:18px 0 8px">TERMINAL SESSIONS</h3>
      <ul class="hlist">${logRows || '<li><span class="cmd">—</span></li>'}</ul>`;
  } catch (e) {
    const body = document.getElementById('mBody');
    if (body) body.innerHTML = `<div class="result-block err">${esc(e.message)}</div>`;
  }
}
async function viewLog(termId) {
  try {
    const text = await fetch('/api/logs/' + termId).then(r => r.text());
    showModal('Terminal Session', `<pre class="biglog">${esc(text) || '(empty)'}</pre>`, true);
  } catch (e) { alert(e.message); }
}

// ===== Settings =====
async function openSettings() {
  showModal('Settings', '<div class="net-empty">Loading...</div>');
  try {
    const cfg = await fetch('/api/config').then(r => r.json());
    const body = document.getElementById('mBody');
    body.innerHTML = `
      <div class="mform">
        <h3 style="font-size:13px;color:var(--dim);margin-bottom:8px">COMMAND WHITELIST (one command per line — empty = allow all)</h3>
        <div class="row"><textarea id="stWhitelist" rows="5">${esc((cfg.whitelist||[]).join('\n'))}</textarea></div>
        <h3 style="font-size:13px;color:var(--dim);margin:18px 0 8px">THRESHOLDS (%) — notification + UI alert when exceeded</h3>
        <div class="row2">
          <div class="row"><label>CPU</label><input id="stCpu" type="number" value="${cfg.thresholds && cfg.thresholds.cpu != null ? cfg.thresholds.cpu : ''}"></div>
          <div class="row"><label>RAM</label><input id="stRam" type="number" value="${cfg.thresholds && cfg.thresholds.ram != null ? cfg.thresholds.ram : ''}"></div>
          <div class="row"><label>Disk</label><input id="stDisk" type="number" value="${cfg.thresholds && cfg.thresholds.disk != null ? cfg.thresholds.disk : ''}"></div>
          <div class="row"><label>Offline (sec)</label><input id="stOff" type="number" value="${cfg.thresholds && cfg.thresholds.offline != null ? cfg.thresholds.offline : ''}"></div>
        </div>
        <h3 style="font-size:13px;color:var(--dim);margin:18px 0 8px">NOTIFICATIONS (Telegram + Discord — leave blank to disable)</h3>
        <div class="row"><label>Telegram Bot Token</label><input id="stTgToken" value="${esc((cfg.notify&&cfg.notify.telegram&&cfg.notify.telegram.token)||'')}" placeholder="123456:ABC..."></div>
        <div class="row"><label>Telegram Chat ID</label><input id="stTgChat" value="${esc((cfg.notify&&cfg.notify.telegram&&cfg.notify.telegram.chatId)||'')}"></div>
        <div class="row"><label>Discord Webhook</label><input id="stDcUrl" value="${esc((cfg.notify&&cfg.notify.discord&&cfg.notify.discord.webhook)||'')}" placeholder="https://discord.com/api/webhooks/..."></div>
        <div class="row"><label>Force QR address (optional — e.g. tailscale IP)</label><input id="stQr" value="${esc(cfg.qrHost||'')}"></div>
        <div class="legend">Note: the command whitelist applies to commands run from this hub's UI. When saved, it is pushed to all agents on the network.</div>
        <button class="btn" onclick="saveSettings()">Save</button>
      </div>`;
  } catch (e) {
    const body = document.getElementById('mBody');
    if (body) body.innerHTML = `<div class="result-block err">${esc(e.message)}</div>`;
  }
}
async function saveSettings() {
  const body = {
    whitelist: document.getElementById('stWhitelist').value.split('\n').map(s => s.trim()).filter(Boolean),
    thresholds: {
      cpu: parseInt(document.getElementById('stCpu').value, 10) || 0,
      ram: parseInt(document.getElementById('stRam').value, 10) || 0,
      disk: parseInt(document.getElementById('stDisk').value, 10) || 0,
      offline: parseInt(document.getElementById('stOff').value, 10) || 0,
    },
    notify: {
      telegram: { token: document.getElementById('stTgToken').value.trim(), chatId: document.getElementById('stTgChat').value.trim() },
      discord: { webhook: document.getElementById('stDcUrl').value.trim() },
    },
    qrHost: document.getElementById('stQr').value.trim(),
  };
  try {
    await fetch('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    logEntry('Settings', 'saved', '');
    closeModal();
  } catch (e) { alert(e.message); }
}

function renderHistory(data) {
  const names = {};
  for (const a of agentsCache) names[a.id] = a.hostname;
  const rows = (data || []).flatMap(h => (h.list || []).slice(-5).map(c => ({ id: h.id, ...c }))).slice(-8).reverse();
  histBody.innerHTML = rows.length ? rows.map(c =>
    `<div style="font-family:monospace;font-size:11px;padding:4px 0;border-bottom:1px dashed var(--border)">
       <span style="color:var(--dim)">${esc(names[c.id] || c.id.slice(0,8))} · ${new Date(c.ts).toLocaleTimeString('en')}</span><br>
       <span style="color:var(--text)">${esc(c.command)}</span>
     </div>`).join('') : '<div class="net-empty">No commands run yet.</div>';
}

// Terminal
function openTerm(agentId, hostname) {
  if (termApp) closeTerm();
  termId = 't' + Date.now();
  document.getElementById('termTitle').textContent = `Terminal: ${hostname}`;
  document.getElementById('termModal').classList.add('active');

  termApp = new Terminal({ fontSize: 13, theme: { background: '#0a0e14', foreground: '#c5d0e0', cursor: '#4cc9f0' } });
  termFit = new FitAddon.FitAddon();
  termApp.loadAddon(termFit);
  termApp.open(document.getElementById('termContainer'));
  termFit.fit();

  termApp.onData(d => socket.emit('term-input', { termId, data: d }));
  socket.emit('init-term', { agentId, termId, cols: termApp.cols, rows: termApp.rows });
}

function closeTerm() {
  if (termId) socket.emit('term-close', { termId });
  if (termApp) { termApp.dispose(); termApp = null; }
  termId = null;
  document.getElementById('termModal').classList.remove('active');
}

socket.on('term-output', ({ termId: tid, data }) => { if (termApp && tid === termId) termApp.write(data); });
socket.on('term-exit', () => closeTerm());
socket.on('agent-list', renderAgents);
socket.on('stats-update', updateAgentStats);
socket.on('history-update', renderHistory);
socket.on('alert', ({ hostname, metric, value, limit }) => {
  const ic = metric.toUpperCase().replace('_', ' ');
  logEntry('ALERT', `${hostname}: ${ic} ${metric === 'offline' || metric === 'online' ? '' : value + '%'} (threshold %' + limit + ')`, metric === 'online' ? '' : 'warn');
});
socket.on('repo-info', (i) => {
  commitText.textContent = i.commit ? `${i.branch||''}@${i.commit}` : 'no git';
  updateBadge.style.display = i.update ? '' : 'none';
});
socket.on('update-status', ({from, stage, msg}) => logEntry(from, `${stage}: ${msg}`, stage === 'error' ? 'error' : (stage === 'start' || stage === 'restart' ? 'warn' : '')));

setInterval(() => fetch('/api/agents').then(r=>r.json()).then(renderAgents).catch(()=>{}), 1000);

const netBody = document.getElementById('netBody');
function renderNetwork(list) {
  if (!list || !list.length) { netBody.innerHTML = '<div class="net-empty">No devices found on network.</div>'; return; }
  netBody.innerHTML = list.map(p => `
    <div class="net-item">
      <span class="tag ${p.role}">${p.role}</span>
      <span class="who"><b>${esc(p.hostname)}</b> <span class="ip">${esc(p.name||'')} · ${esc(p.src||p.ip)}</span></span>
      <span style="color:var(--dim);font-size:11px">${new Date(p.lastSeen).toLocaleTimeString('en')}</span>
    </div>`).join('');
}
setInterval(() => fetch('/api/network').then(r=>r.json()).then(renderNetwork).catch(()=>{}), 2000);
setInterval(() => fetch('/api/history').then(r=>r.json()).then(renderHistory).catch(()=>{}), 5000);

document.getElementById('termClose').onclick = closeTerm;

// global exposure for inline handlers
Object.assign(window, { openTerm, openBatch, openProcesses, openFiles, openHistory, openQr, openSettings, closeModal, restartAgent, qrUpdate, runBatch, fsLoad, fsParent, fsDownload, fsRefresh, fsUpload, killProc, saveSettings, viewLog });

// PWA
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
